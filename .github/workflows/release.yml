# 发布流水线：tag push（v*）或手动触发时构建 Windows / Linux / macOS 产物，
# 全部成功后自动上传到 GitHub Releases。应用内更新检查读取同一仓库的
# releases/latest（见 crates/app/src/update.rs），产物命名必须保持下面的
# 平台-架构后缀（-linux-x86_64 / -windows-x86_64 / -macos-aarch64），否则
# 客户端无法匹配下载。三个平台都会在构建时拉取上游最新的 bash 放进
# runtime/（见 scripts/fetch-bash.sh 与 scripts/bundle-msys-shell.py）。
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（如 v0.2.0）。留空则只构建 artifact，不发布 Release。"
        required: false
        type: string

permissions:
  contents: write

env:
  # .cargo/config.toml 里的 target-dir 指向开发者本机路径，这里覆盖掉；
  # 产物不带调试符号（仓库的 release profile 为性能实验室保留 debug = true）。
  CARGO_TARGET_DIR: target
  CARGO_PROFILE_RELEASE_DEBUG: "0"
  CARGO_TERM_COLOR: always

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # gpui(x11) 经 xkbcommon crate 链接 -lxcb -lxkbcommon -lxkbcommon-x11；
      # fontconfig 走 dlopen，构建期不需要。
      - name: 安装系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libxkbcommon-x11-dev libxcb1-dev

      # 随包 bash：musl 静态二进制不绑定构建机的 glibc 版本。脚本每次都从
      # ftp.gnu.org 解析最新的 bash 版本再构建，因此 release 自动拿到更新。
      - name: 构建随包 bash
        run: |
          sudo apt-get install -y musl-tools
          bash scripts/fetch-bash.sh runtime linux

      - name: 解析版本号
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$REF_NAME" == v* ]]; then
            VERSION="${REF_NAME#v}"
          elif [[ -n "$INPUT_TAG" ]]; then
            VERSION="${INPUT_TAG#v}"
          else
            VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: 校验 tag 与 Cargo.toml 版本一致
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$VERSION" != "$cargo_version" ]; then
            echo "::error::tag v$VERSION 与 Cargo.toml 版本 $cargo_version 不一致，请对齐后重新打 tag"
            exit 1
          fi

      - name: 构建
        run: |
          set -o pipefail
          cargo build --release -p effibuddy-app 2>&1 | tee build.log

      # 匿名拉不到 Actions 日志，把错误尾部写进注解（API 匿名可读）。
      - name: 失败时输出编译错误注解
        if: failure()
        run: |
          if [ -f build.log ]; then
            msg="$(tail -c 3500 build.log | sed -e ':a' -e 'N' -e '$!ba' -e 's/%/%25/g' -e 's/\r/%0D/g' -e ':b' -e 'N' -e '$!ba' -e 's/\n/%0A/g')"
            echo "::error::Linux 构建失败，日志尾部：%0A$msg"
          fi

      - name: 上传构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-build-log
          path: build.log
          if-no-files-found: ignore

      - name: 冒烟测试
        run: |
          ./target/release/effibuddy --version
          runtime/bash -lc 'echo bundled-bash-ok; ls --version | head -1'

      - name: 打包 tar.gz
        run: |
          bundle="dist/EffiBuddy-$VERSION-linux-x86_64"
          mkdir -p "$bundle/runtime"
          cp target/release/effibuddy "$bundle/"
          cp README.md "$bundle/"
          cp runtime/bash runtime/BASH-COPYING runtime/BASH-VERSION "$bundle/runtime/"
          tar -czf "EffiBuddy-$VERSION-linux-x86_64.tar.gz" -C dist "EffiBuddy-$VERSION-linux-x86_64"

      # 运行时依赖：x11/wayland 输入与 fontconfig 为 gpui 必需，libvulkan1
      # 由 blade-graphics 经 ash 在运行时 dlopen（大多数桌面发行版已随 mesa 安装）。
      - name: 打包 deb
        run: |
          root="dist/effibuddy_${VERSION}_amd64"
          mkdir -p "$root/DEBIAN" "$root/usr/bin" "$root/usr/share/applications" \
            "$root/usr/lib/effibuddy/runtime"
          install -m 755 target/release/effibuddy "$root/usr/bin/effibuddy"
          install -m 755 runtime/bash "$root/usr/lib/effibuddy/runtime/bash"
          install -m 644 runtime/BASH-COPYING runtime/BASH-VERSION "$root/usr/lib/effibuddy/runtime/"
          cat > "$root/DEBIAN/control" <<EOF
          Package: effibuddy
          Version: $VERSION
          Architecture: amd64
          Maintainer: lumenShen <178133225+lumenShen@users.noreply.github.com>
          Depends: libxkbcommon0, libxkbcommon-x11-0, libxcb1, libfontconfig1, libvulkan1
          Description: EffiBuddy — local-first coding agent desktop app
           GPUI-based desktop shell for a local-first coding agent.
          EOF
          cat > "$root/usr/share/applications/effibuddy.desktop" <<EOF
          [Desktop Entry]
          Type=Application
          Name=EffiBuddy
          Exec=effibuddy
          Terminal=false
          Categories=Development;
          EOF
          dpkg-deb --build --root-owner-group "$root" "effibuddy_${VERSION}_amd64.deb"

      # rpm：系统 rpmbuild 直接装预编译二进制；依赖用与 deb Depends 对齐的
      # soname（跨发行版可解析），关闭自动依赖扫描保持确定性。
      - name: 打包 rpm
        run: |
          sudo apt-get install -y rpm
          mkdir -p rpmbuild/{BUILD,RPMS,SOURCES,SPECS,SRPMS}
          cat > rpmbuild/SPECS/effibuddy.spec <<EOF
          Name:           effibuddy
          Version:        ${VERSION}
          Release:        1%{?dist}
          Summary:        EffiBuddy — local-first coding agent desktop app
          License:        MIT
          AutoReqProv:    no
          BuildArch:      x86_64
          Requires:       libxkbcommon.so.0()(64bit), libxkbcommon-x11.so.0()(64bit), libxcb.so.1()(64bit), libfontconfig.so.1()(64bit), libvulkan.so.1()(64bit)

          %description
          GPUI-based desktop shell for a local-first coding agent.

          %install
          install -Dm755 "$PWD/target/release/effibuddy" "%{buildroot}/usr/bin/effibuddy"
          install -Dm755 "$PWD/runtime/bash" "%{buildroot}/usr/lib/effibuddy/runtime/bash"
          install -Dm644 "$PWD/runtime/BASH-COPYING" "%{buildroot}/usr/lib/effibuddy/runtime/BASH-COPYING"
          install -Dm644 "$PWD/runtime/BASH-VERSION" "%{buildroot}/usr/lib/effibuddy/runtime/BASH-VERSION"
          install -Dm644 "$PWD/dist/effibuddy_${VERSION}_amd64/usr/share/applications/effibuddy.desktop" "%{buildroot}/usr/share/applications/effibuddy.desktop"

          %files
          %defattr(-,root,root,-)
          /usr/bin/effibuddy
          /usr/lib/effibuddy/runtime/bash
          /usr/lib/effibuddy/runtime/BASH-COPYING
          /usr/lib/effibuddy/runtime/BASH-VERSION
          /usr/share/applications/effibuddy.desktop
          EOF
          rpmbuild -bb --define "_topdir $PWD/rpmbuild" rpmbuild/SPECS/effibuddy.spec
          cp rpmbuild/RPMS/x86_64/effibuddy-*.x86_64.rpm .

      - uses: actions/upload-artifact@v4
        with:
          name: linux-artifacts
          path: |
            EffiBuddy-*-linux-x86_64.tar.gz
            effibuddy_*_amd64.deb
            effibuddy-*.x86_64.rpm
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: 解析版本号
        shell: pwsh
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if ($env:REF_NAME -like 'v*') {
            $v = $env:REF_NAME.Substring(1)
          } elseif ($env:INPUT_TAG) {
            $v = $env:INPUT_TAG -replace '^v', ''
          } else {
            $v = (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"').Matches[0].Groups[1].Value
          }
          "VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # 随包 bash：解析 MSYS2 实时仓库数据库取当前最新包，逐个校验 sha256
      # 后抽出 runtime\msys；脚本在 Windows 上还会跑一次 bash 冒烟。
      # runner 通常自带 zstd；缺失时补装，脚本用它解 .pkg.tar.zst。
      - name: 准备 zstd
        shell: pwsh
        run: |
          if (-not (Get-Command zstd -ErrorAction SilentlyContinue)) {
            choco install zstd -y --no-progress
            if ($LASTEXITCODE -notin 0, 3010) { exit $LASTEXITCODE }
          }

      - name: 打包随包 bash（MSYS2）
        run: python scripts/bundle-msys-shell.py runtime/msys

      - name: 构建
        shell: pwsh
        run: |
          cargo build --release -p effibuddy-app 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 失败时输出编译错误注解
        if: failure()
        shell: pwsh
        run: |
          if (Test-Path build.log) {
            $log = (Get-Content build.log -Tail 40) -join '%0A'
            Write-Host "::error::Windows 构建失败，日志尾部：%0A$log"
          }

      - name: 上传构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-build-log
          path: build.log
          if-no-files-found: ignore

      - name: 冒烟测试
        shell: pwsh
        run: |
          target\release\effibuddy.exe --version
          $env:PATH = "$PWD\runtime\msys\usr\bin;$PWD\runtime\msys\usr\local\bin;$env:PATH"
          & "$PWD\runtime\msys\usr\bin\bash.exe" --noprofile --norc -c "echo bundled-bash-ok; ls --version | head -1"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: 打包 zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "dist/EffiBuddy-$env:VERSION-windows-x86_64" | Out-Null
          Copy-Item target\release\effibuddy.exe "dist/EffiBuddy-$env:VERSION-windows-x86_64/"
          Copy-Item README.md "dist/EffiBuddy-$env:VERSION-windows-x86_64/" -ErrorAction SilentlyContinue
          Copy-Item runtime "dist/EffiBuddy-$env:VERSION-windows-x86_64/runtime" -Recurse
          Compress-Archive -Path "dist/EffiBuddy-$env:VERSION-windows-x86_64" -DestinationPath "EffiBuddy-$env:VERSION-windows-x86_64.zip"

      - name: 安装 NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          if ($LASTEXITCODE -notin 0, 3010) { exit $LASTEXITCODE }
          # choco 的 shim 机制不覆盖 makensis，把安装目录显式加进 PATH。
          Add-Content $env:GITHUB_PATH "C:\Program Files (x86)\NSIS"

      # 占位符注入版本号（NSIS 的 $ 变量不能出现在 PowerShell 可展开的
      # 字符串里，所以这里用单引号 here-string + __VERSION__）。
      - name: 生成 NSIS 安装包
        shell: pwsh
        run: |
          $nsi = @'
          !define APPNAME "EffiBuddy"
          OutFile "EffiBuddy-__VERSION__-windows-x86_64-setup.exe"
          InstallDir "$PROGRAMFILES64\${APPNAME}"
          RequestExecutionLevel admin
          Page directory
          Page instfiles
          Section
            SetOutPath "$INSTDIR"
            File "target\release\effibuddy.exe"
            SetOutPath "$INSTDIR\runtime\msys"
            File /r "runtime\msys\*.*"
            SetOutPath "$INSTDIR"
            WriteUninstaller "$INSTDIR\uninstall.exe"
            CreateDirectory "$SMPROGRAMS\${APPNAME}"
            CreateShortCut "$SMPROGRAMS\${APPNAME}\${APPNAME}.lnk" "$INSTDIR\effibuddy.exe"
            CreateShortCut "$DESKTOP\${APPNAME}.lnk" "$INSTDIR\effibuddy.exe"
            WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\${APPNAME}" "DisplayName" "${APPNAME}"
            WriteRegStr HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\${APPNAME}" "UninstallString" "$INSTDIR\uninstall.exe"
          SectionEnd
          Section "Uninstall"
            Delete "$INSTDIR\effibuddy.exe"
            Delete "$INSTDIR\uninstall.exe"
            RMDir /r "$INSTDIR\runtime"
            RMDir "$INSTDIR"
            Delete "$SMPROGRAMS\${APPNAME}\${APPNAME}.lnk"
            RMDir "$SMPROGRAMS\${APPNAME}"
            Delete "$DESKTOP\${APPNAME}.lnk"
            DeleteRegKey HKLM "Software\Microsoft\Windows\CurrentVersion\Uninstall\${APPNAME}"
          SectionEnd
          '@
          $nsi = $nsi -replace '__VERSION__', $env:VERSION
          $nsi | Out-File -FilePath installer.nsi -Encoding utf8
          makensis installer.nsi

      - uses: actions/upload-artifact@v4
        with:
          name: windows-artifacts
          path: |
            EffiBuddy-*-windows-x86_64.zip
            EffiBuddy-*-windows-x86_64-setup.exe
          if-no-files-found: error

  build-macos:
    # macos-latest 是 Apple Silicon；产物后缀用 aarch64，与客户端
    # std::env::consts::ARCH 对齐（更新检查按架构精确匹配）。
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # 随包 bash：与 Linux 共用脚本，但 macOS 不能静态链接 libSystem，
      # 因此按系统库正常构建。每次发布同样拉取 ftp.gnu.org 的最新版本。
      - name: 构建随包 bash
        run: bash scripts/fetch-bash.sh runtime macos

      - name: 解析版本号
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$REF_NAME" == v* ]]; then
            VERSION="${REF_NAME#v}"
          elif [[ -n "$INPUT_TAG" ]]; then
            VERSION="${INPUT_TAG#v}"
          else
            VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: 校验 tag 与 Cargo.toml 版本一致
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          cargo_version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          if [ "$VERSION" != "$cargo_version" ]; then
            echo "::error::tag v$VERSION 与 Cargo.toml 版本 $cargo_version 不一致，请对齐后重新打 tag"
            exit 1
          fi

      - name: 构建
        run: |
          set -o pipefail
          cargo build --release -p effibuddy-app 2>&1 | tee build.log

      - name: 失败时输出编译错误注解
        if: failure()
        run: |
          if [ -f build.log ]; then
            msg="$(tail -c 3500 build.log | sed -e ':a' -e 'N' -e '$!ba' -e 's/%/%25/g' -e 's/\r/%0D/g' -e ':b' -e 'N' -e '$!ba' -e 's/\n/%0A/g')"
            echo "::error::macOS 构建失败，日志尾部：%0A$msg"
          fi

      - name: 上传构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-build-log
          path: build.log
          if-no-files-found: ignore

      - name: 冒烟测试
        run: |
          ./target/release/effibuddy --version
          runtime/bash -lc 'echo bundled-bash-ok; ls --version | head -1'

      - name: 打包 tar.gz
        run: |
          arch="$(uname -m)"
          case "$arch" in
            arm64) arch="aarch64" ;;
          esac
          bundle="dist/EffiBuddy-$VERSION-macos-$arch"
          mkdir -p "$bundle/runtime"
          cp target/release/effibuddy "$bundle/"
          cp README.md "$bundle/"
          cp runtime/bash runtime/BASH-COPYING runtime/BASH-VERSION "$bundle/runtime/"
          cat > "$bundle/README-macos.txt" <<'EOF'
          EffiBuddy for macOS (unsigned build)

          If macOS refuses to run the binaries because the developer cannot be
          verified, clear the quarantine attribute once after extracting:

            xattr -dr com.apple.quarantine .

          The bundled GNU bash runtime lives in runtime/bash; the app prefers it
          over the system /bin/bash (3.2) for agent shell commands.
          EOF
          tar -czf "EffiBuddy-$VERSION-macos-$arch.tar.gz" -C dist "EffiBuddy-$VERSION-macos-$arch"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-artifacts
          path: EffiBuddy-*-macos-*.tar.gz
          if-no-files-found: error

  release:
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.tag != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # 手动触发且给出 tag 时：tag 不存在则在当前 HEAD 上创建并推送。
      - name: 创建缺失的 tag（手动触发）
        if: ${{ inputs.tag != '' && !startsWith(github.ref, 'refs/tags/v') }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if ! git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$TAG"
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          files: |
            dist/EffiBuddy-*-linux-x86_64.tar.gz
            dist/effibuddy_*_amd64.deb
            dist/effibuddy-*.x86_64.rpm
            dist/EffiBuddy-*-macos-*.tar.gz
            dist/EffiBuddy-*-windows-x86_64.zip
            dist/EffiBuddy-*-windows-x86_64-setup.exe
          generate_release_notes: true
