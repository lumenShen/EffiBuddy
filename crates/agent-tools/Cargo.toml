[package]
name = "effibuddy-agent-tools"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Built-in tools for the EffiBuddy agent runtime"

[dependencies]
async-trait.workspace = true
base64 = "0.22"
effibuddy-agent-core.workspace = true
effibuddy-agent-js.workspace = true
effibuddy-browser.workspace = true
effibuddy-computer.workspace = true
futures.workspace = true
regex.workspace = true
reqwest.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# `webfetch` resolves hostnames itself (tokio::net::lookup_host) so a private
# address cannot hide behind DNS.
tokio = { workspace = true, features = ["net"] }
tokio-util.workspace = true

[features]
# Stress lab: virtual tool set and the RAM-rooted real-tool set. Opt-in only.
stress = ["effibuddy-agent-core/stress"]

[dev-dependencies]
effibuddy-agent-core = { path = "../agent-core", features = ["testing"] }
effibuddy-browser = { path = "../browser-use", features = ["testing"] }
effibuddy-computer = { path = "../computer-use", features = ["testing"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt", "macros", "time", "net", "io-util"] }
