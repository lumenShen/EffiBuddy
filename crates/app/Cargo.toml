[package]
name = "effibuddy-app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
description = "EffiBuddy — a GPUI desktop shell for a local-first coding agent"

[[bin]]
name = "effibuddy"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
base64 = "0.22"
chrono.workspace = true
dirs.workspace = true
effibuddy-agent-core.workspace = true
effibuddy-agent-tools.workspace = true
effibuddy-browser.workspace = true
effibuddy-computer.workspace = true
effibuddy-ui.workspace = true
gpui.workspace = true
# glibc allocator tuning + malloc stats for the Settings → 内存 panel.
libc = "0.2"
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
similar = { version = "2", features = ["inline"] }
tokio.workspace = true
tokio-util.workspace = true
# Session export. Stored (uncompressed) entries are enough: images are already
# compressed and JSON benefits little; this keeps the dependency set minimal.
zip = { version = "2.4", default-features = false }

[features]
# Stress lab: in-app 1000-session/subagent concurrency mode. Opt-in only —
# the default build contains no stress code.
stress = ["effibuddy-agent-core/stress", "effibuddy-agent-tools/stress"]

[dev-dependencies]
effibuddy-agent-core = { path = "../agent-core", features = ["testing"] }
effibuddy-browser = { path = "../browser-use", features = ["testing"] }
effibuddy-computer = { path = "../computer-use", features = ["testing"] }
tempfile.workspace = true
